version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: ouhve-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ouhve
      POSTGRES_PASSWORD: ouhve_dev
      POSTGRES_DB: ouhve
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
